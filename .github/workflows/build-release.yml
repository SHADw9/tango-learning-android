name: Build & Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional: add these repository secrets to sign with your own key (see README)
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Use custom signing key (only if secrets are set)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle assembleRelease -PversionCode=${{ github.run_number }} -PversionName=${{ env.VERSION }} --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "Tango-Learning-v${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Tango-Learning-v${{ env.VERSION }}
          path: Tango-Learning-v${{ env.VERSION }}.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" "Tango-Learning-v${VERSION}.apk" \
            --target "${{ github.sha }}" \
            --title "Tango Learning v${VERSION}" \
            --notes "Automated build #${{ github.run_number }} from commit ${GITHUB_SHA::7}. Download the APK below and install it on your Android phone."
